openapi: 3.1.0
info:
  title: Request Bodies Codegen
  version: "1.0.0"
paths:
  /login:
    post:
      operationId: formLogin
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
      responses:
        "200":
          description: ok
  /upload:
    post:
      operationId: multipartUpload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: ok
  /upload-mix:
    post:
      operationId: multipartMix
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                username:
                  type: string
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: ok
  /importance:
    post:
      operationId: scalarImportance
      requestBody:
        content:
          application/json:
            schema:
              type: integer
      responses:
        "200":
          description: ok
  /upload-raw:
    post:
      operationId: binaryRaw
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: ok
components:
  schemas:
    Unused:
      type: object
      properties:
        dummy:
          type: string
