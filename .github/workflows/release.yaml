name: release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version

      - name: sync dependencies
        run: uv sync --all-extras

      - name: run tests
        run: uv run pytest

  release:
    name: release
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version

      - name: sync dependencies
        run: uv sync --all-extras

      - name: bump version and generate changelog
        id: bump
        run: |
          set +e
          DRY_RUN_OUTPUT=$(uv run cz bump --dry-run 2>&1)
          DRY_RUN_EXIT=$?
          set -e
          echo "$DRY_RUN_OUTPUT"
          if [ $DRY_RUN_EXIT -ne 0 ]; then
            echo "No commits to bump, skipping release."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run cz bump \
            --changelog \
            --files-only \
            --yes
          NEW_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: build package
        if: steps.bump.outputs.bumped == 'true'
        run: uv build

      - name: publish to PyPI
        if: steps.bump.outputs.bumped == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

      - name: open release PR
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          BRANCH="release/${NEW_VERSION}"
          git checkout -b "$BRANCH"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore(release): bump version to ${NEW_VERSION}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore(release): bump version to ${NEW_VERSION}" \
            --body "Automated release. PyPI publish has already happened in the triggering workflow run.")
          gh pr merge --auto --squash "$PR_URL"
          echo "Release PR: $PR_URL"
