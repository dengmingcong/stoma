[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stoma"
version = "0.1.0"
description = "Pythonic 接口自动化与接口自动化测试框架，代码即协议"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "dengmingcong", email = "mc.deng@outlook.com" },
]
keywords = ["http", "api", "testing", "automation", "openapi", "pydantic", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.6.0",
    "playwright>=1.60.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
cli = [
    "openapi-pydantic>=0.5.1",
    "datamodel-code-generator>=0.25.0",
    "ruamel.yaml>=0.18.0",
    "jsonref>=1.1.0",
]
test = [
    "pytest>=8.4.2",
    "allure-pytest>=2.15.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.20",
]

[project.urls]
Repository = "https://github.com/dengmingcong/stoma"

[project.scripts]
stoma = "stoma.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "commitizen>=3.0.0",
    "stoma[cli,test]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stoma"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    # 不启用 RUF：RUF002/003 把全角字符判定为 ambiguous，与项目中文标点规范冲突。
]

[tool.ruff.lint.isort]
known-first-party = ["stoma"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "PT011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "jsonref"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--ignore=tests/examples"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
